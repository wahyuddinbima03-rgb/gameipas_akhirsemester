<head>
  <meta charset="UTF-8" />

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <style>
    :root {
      --font-display: 'Fredoka', cursive, sans-serif;
      --font-body: 'Nunito', sans-serif;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font-body);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      overflow-x: hidden;
      background: linear-gradient(180deg, #38bdf8 0%, #7dd3fc 40%, #bae6fd 75%, #e0f2fe 100%);
      color: #1e293b;
      user-select: none;
    }

    h1, h2, h3, h4, .font-display {
      font-family: var(--font-display);
    }

    /* Animated Clouds & Floating Islands */
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes floatMedium {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-7px) rotate(1deg); }
    }
    @keyframes driftCloud {
      0% { transform: translateX(-120px); }
      100% { transform: translateX(calc(100vw + 140px)); }
    }
    @keyframes popIn {
      0% { transform: scale(0.85); opacity: 0; }
      70% { transform: scale(1.03); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(250, 204, 21, 0.65); }
      50% { box-shadow: 0 0 0 12px rgba(250, 204, 21, 0); }
    }
    @keyframes shakeWrong {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-6px); }
      80% { transform: translateX(6px); }
    }

    .animate-float-slow { animation: floatSlow 4s ease-in-out infinite; }
    .animate-float-med { animation: floatMedium 3.2s ease-in-out infinite; }
    .animate-pop { animation: popIn 0.35s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .animate-pulse-glow { animation: pulseGlow 2s infinite; }
    .animate-shake { animation: shakeWrong 0.45s ease-in-out; }

    .cloud {
      position: fixed;
      pointer-events: none;
      z-index: 0;
      opacity: 0.75;
    }
    .cloud-1 { top: 8%; animation: driftCloud 46s linear infinite; }
    .cloud-2 { top: 22%; animation: driftCloud 64s linear infinite -20s; }
    .cloud-3 { top: 48%; animation: driftCloud 54s linear infinite -35s; }

    /* Tactile 3D Cartoon Buttons */
    .btn-3d {
      transition: all 0.14s cubic-bezier(0.34, 1.56, 0.64, 1);
      border-bottom-width: 5px;
      cursor: pointer;
    }
    .btn-3d:hover:not(:disabled) {
      transform: translateY(-2px);
      filter: brightness(1.04);
    }
    .btn-3d:active:not(:disabled) {
      transform: translateY(3px);
      border-bottom-width: 2px;
    }
    .btn-3d:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    /* Card Style */
    .card-adventure {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      border: 3px solid #ffffff;
      box-shadow: 0 12px 28px -6px rgba(14, 116, 144, 0.22), 0 4px 0 rgba(148, 163, 184, 0.25);
      border-radius: 1.5rem;
    }

    /* Island Card Hover */
    .island-card {
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease;
    }
    .island-card:hover {
      transform: translateY(-6px) scale(1.02);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: rgba(255,255,255,0.4); border-radius: 99px; }
    ::-webkit-scrollbar-thumb { background: #38bdf8; border-radius: 99px; }

    /* Particle Canvas */
    #fx-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 60;
    }

    /* Print Certificate cleanly */
    @media print {
      body { background: white !important; }
      .no-print { display: none !important; }
      .print-only-clean { box-shadow: none !important; border: 3px solid #f59e0b !important; }
    }

    /* =========================================================================
       1. WEB AUDIO API SOUND SYNTHESIZER (No external audio files needed)

    const SoundFX = {
      ctx: null,
      enabled: true,
      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      },
      playTone(freq, type, duration, delay = 0, vol = 0.16) {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime + delay;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(vol, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + duration);
      },
      click() {
        this.playTone(540, 'sine', 0.08, 0, 0.12);
      },
      correct() {
        this.playTone(523.25, 'triangle', 0.14, 0, 0.18);    // C5
        this.playTone(659.25, 'triangle', 0.14, 0.09, 0.18); // E5
        this.playTone(783.99, 'triangle', 0.25, 0.18, 0.2);  // G5
      },
      wrong() {
        this.playTone(300, 'sawtooth', 0.18, 0, 0.12);
        this.playTone(230, 'sawtooth', 0.26, 0.14, 0.12);
      },
      badge() {
        const notes = [523.25, 659.25, 783.99, 1046.5];
        notes.forEach((n, idx) => {
          this.playTone(n, 'triangle', 0.22, idx * 0.1, 0.2);
        });
      }
    };

    function toggleSound() {

    /* =========================================================================
       2. PARTICLE STARBURST ENGINE (Canvas FX)
       ========================================================================= */
    const ParticleFX = {
      canvas: document.getElementById('fx-canvas'),
      ctx: null,
      particles: [],
      running: false,
      init() {
        this.ctx = this.canvas.getContext('2d');
        this.resize();
        window.addEventListener('resize', () => this.resize());
      },
      resize() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
      },
      burst(x, y, count = 28) {
        const colors = ['#facc15', '#fb923c', '#34d399', '#38bdf8', '#f472b6', '#a78bfa'];
        for (let i = 0; i < count; i++) {
          const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.4;
          const speed = 3 + Math.random() * 6;
          this.particles.push({
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 2,
            size: 5 + Math.random() * 6,
            color: colors[Math.floor(Math.random() * colors.length)],
            alpha: 1,
            rot: Math.random() * Math.PI * 2,
            vRot: (Math.random() - 0.5) * 0.2,
            isStar: Math.random() > 0.35
          });
        }
        if (!this.running) {
          this.running = true;
          this.loop();
        }
      },
      drawStar(ctx, r) {
        ctx.beginPath();
        for (let i = 0; i < 5; i++) {
          ctx.lineTo(Math.cos(((18 + i * 72) * Math.PI) / 180) * r, -Math.sin(((18 + i * 72) * Math.PI) / 180) * r);
          ctx.lineTo(Math.cos(((54 + i * 72) * Math.PI) / 180) * (r * 0.45), -Math.sin(((54 + i * 72) * Math.PI) / 180) * (r * 0.45));
        }
        ctx.closePath();
        ctx.fill();
      },
      loop() {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        for (let i = this.particles.length - 1; i >= 0; i--) {
          const p = this.particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.18; // gravity
          p.alpha -= 0.018;
          p.rot += p.vRot;
          if (p.alpha <= 0) {
            this.particles.splice(i, 1);
            continue;
          }
          this.ctx.save();
          this.ctx.globalAlpha = Math.max(0, p.alpha);
          this.ctx.translate(p.x, p.y);
          this.ctx.rotate(p.rot);
          this.ctx.fillStyle = p.color;
          if (p.isStar) {
            this.drawStar(this.ctx, p.size);
          } else {
            this.ctx.beginPath();
            this.ctx.arc(0, 0, p.size * 0.6, 0, Math.PI * 2);
            this.ctx.fill();
          }
          this.ctx.restore();
        }
        if (this.particles.length > 0) {
          requestAnimationFrame(() => this.loop());
        } else {
          this.running = false;
        }
      }
    };

            prompt: 'Pasangkan setiap konsep di kolom kiri dengan contoh atau deskripsi yang tepat di kolom kanan!',
            pairs: [
              { id: 'c1', left: '1. Peristiwa sekitar kemerdekaan', right: 'Peristiwa Rengasdengklok dan perumusan naskah menjelang 17 Agustus 1945' },
              { id: 'c2', left: '2. Kerja sama internasional', right: 'ASEAN dan PBB sebagai wadah kerja sama antarnegara' },
              { id: 'c3', left: '3. Warisan budaya Indonesia', right: 'Batik, pencak silat, dan wayang yang dikenal luas di dunia' }
            ],
            explanation: 'Sempurna! Kamu berhasil menghubungkan jejak sejarah kemerdekaan, diplomasi global, dan budaya Nusantara.'
          },
          {
            akmRef: 'AKM Soal 24 • Tantangan Isian Cepat',
            type: 'fill',
            prompt: 'Salah satu organisasi internasional terbesar di dunia tempat Indonesia menjalin kerja sama antarnegara selain ASEAN adalah...',
            answer: 'PBB',
            hint: 'Singkatan dari Perserikatan Bangsa-Bangsa (3 huruf)',
            letterBank: ['P', 'B', 'B', 'A', 'S', 'E', 'N', 'W'],
            explanation: 'Benar! PBB (Perserikatan Bangsa-Bangsa) adalah organisasi internasional tempat Indonesia berperan aktif menjaga perdamaian dan kerja sama.'

          {

            type: 'case',
            prompt: 'Sebagai Duta Budaya Kelas 6 SD, aksi nyata mana yang paling berdampak untuk melestarikan budaya lokal sekaligus bijak dalam kerja sama global?',
            options: [
              {
                title: 'Aktif Berlatih Seni Tradisi & Promosi Kreatif',
                desc: 'Ikut ekstrakurikuler gamelan/angklung/pencak silat/membatik, bangga memakai produk lokal, dan membuat pameran kelas edukatif untuk memperkenalkan budaya daerah.',
                isCorrect: true
              },
              {
                title: 'Malu Mempelajari Budaya Daerah Sendiri',
                desc: 'Menganggap kesenian tradisi sudah ketinggalan zaman dan hanya meniru seluruh gaya hidup asing tanpa menyaringnya.',
                isCorrect: false
              },
              {
                title: 'Menutup Diri dari Pertukaran Pelajar',
                desc: 'Menolak berkenalan dengan teman dari negara lain sehingga tidak ada pertukaran ilmu dan budaya.',
                isCorrect: false
              }
            ],
            explanation: 'Hebat, Duta Nusantara! Berlatih seni tradisi dan bangga mempromosikannya menjaga warisan bangsa tetap hidup di panggung dunia.'
          }

    ];

    /* =========================================================================
       4. APPLICATION STATE
       ========================================================================= */
    const state = {
      screen: 'welcome', // 'welcome' | 'map' | 'mission' | 'certificate'
      playerName: '',
      avatarId: 'sains',
      xp: 0,
      hearts: 5,
      maxHearts: 5,
      streak: 0,
      bestStreak: 0,
      currentZoneId: 0,
      currentMissionIdx: 0,
      // Track completion per zone: { completed: bool, score: number, total: number, results: [] }
      zoneProgress: ZONES.map((z) => ({
        completed: false,
        correctCount: 0,
        totalMissions: z.missions.length,
        xpEarned: 0
      })),
      // Interactive state for current question
      answered: false,
      isCurrentCorrect: false,
      pgSelected: null,
      pgkChecked: [],
      tfAnswers: {},
      matchSelectedLeft: null,
      matchPairsDone: {}, // { leftId: rightIndex }
      matchShuffledRight: [],
      fillInput: '',
      caseSelected: null
    };

    /* =========================================================================
       5. HELPER FUNCTIONS
       ========================================================================= */
    function getAvatar() {
      return AVATARS.find((a) => a.id === state.avatarId) || AVATARS[0];
    }

    function showToast(msg, icon = '💡') {
      const box = document.getElementById('toast-box');
      document.getElementById('toast-msg').textContent = msg;
      document.getElementById('toast-icon').textContent = icon;
      box.classList.remove('hidden');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => {
        box.classList.add('hidden');
      }, 2600);
    }

    function updateHUD() {
      const hud = document.getElementById('hud-bar');
      if (state.screen === 'welcome') {
        hud.classList.add('hidden');
        return;
      }
      hud.classList.remove('hidden');
      const av = getAvatar();
      document.getElementById('hud-avatar').textContent = av.emoji;
      document.getElementById('hud-name').textContent = state.playerName || 'Petualang Cilik';
      document.getElementById('hud-role').textContent = av.role;

      // Hearts display
      let heartsStr = '';
      for (let i = 0; i < state.maxHearts; i++) {
        heartsStr += i < state.hearts ? '❤️' : '🤍';
      }
      document.getElementById('hud-hearts').textContent = heartsStr;

      // Streak & XP
      document.getElementById('hud-streak').textContent = state.streak;
      document.getElementById('hud-xp').textContent = `${state.xp} XP`;

      // Mini Badges in HUD
      const badgesContainer = document.getElementById('hud-badges');
      badgesContainer.innerHTML = ZONES.map((z, idx) => {
        const unlocked = state.zoneProgress[idx].completed;
        return `<span class="text-xs px-1.5 py-0.5 rounded-md border ${
          unlocked
            ? 'bg-amber-100 border-amber-400 text-amber-800 shadow-sm'
            : 'bg-slate-100 border-slate-200 text-slate-400 grayscale opacity-60'
        }" title="${z.badgeName}">${z.badgeIcon}</span>`;
      }).join('');

      // Back to Map button visibility
      const btnMap = document.getElementById('btn-back-map');
      if (state.screen === 'mission') {
        btnMap.classList.remove('hidden');
      } else {
        btnMap.classList.add('hidden');
      }
    }

    function openStimulusModal(zoneId) {
      SoundFX.click();
      const zone = ZONES[zoneId];
      document.getElementById('modal-title').textContent = zone.stimulusTitle;
      document.getElementById('modal-body').innerHTML = zone.stimulusHTML;
      document.getElementById('stimulus-modal').classList.remove('hidden');
    }

    function closeStimulusModal() {
      SoundFX.click();
      document.getElementById('stimulus-modal').classList.add('hidden');
    }

    function triggerBurstFromCenter() {
      ParticleFX.burst(window.innerWidth / 2, window.innerHeight * 0.42, 34);
    }

    /* =========================================================================
       6. SCREEN NAVIGATION & RENDERERS
       ========================================================================= */
    function render() {
      updateHUD();
      const root = document.getElementById('app-root');
      if (state.screen === 'welcome') {
        root.innerHTML = renderWelcomeScreen();
      } else if (state.screen === 'map') {
        root.innerHTML = renderMapScreen();
      } else if (state.screen === 'mission') {
        root.innerHTML = renderMissionScreen();
      } else if (state.screen === 'certificate') {
        root.innerHTML = renderCertificateScreen();
      }
    }

    /* --- SCREEN 1: WELCOME --- */
    function renderWelcomeScreen() {
      return `
        <div class="min-h-[86vh] flex flex-col items-center justify-center py-4">
          <div class="card-adventure w-full max-w-2xl p-6 sm:p-8 text-center animate-pop">
            <!-- Hero Emblem -->
            <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-amber-100 border-2 border-amber-300 text-amber-800 font-display font-bold text-xs sm:text-sm mb-3">
              <span>✨</span> GAME EDUKASI AKM IPAS KELAS 6 SD <span>✨</span>
            </div>

            <div class="text-5xl sm:text-6xl mb-2 animate-float-slow">🏝️🧭🚀</div>

            <h1 class="font-display font-bold text-2xl sm:text-4xl text-sky-900 leading-tight">
              Petualangan Jelajah IPAS Kelas 6
            </h1>
            <p class="font-display font-semibold text-base sm:text-xl text-amber-600 mt-1">

            <p class="text-slate-600 text-sm sm:text-base mt-2 max-w-lg mx-auto">

            <!-- Player Name Input -->
            <div class="mt-6 text-left max-w-md mx-auto">
              <label for="input-player-name" class="block font-display font-bold text-slate-700 text-sm sm:text-base mb-1.5">

              </label>
              <input
                id="input-player-name"
                type="text"
                maxlength="24"
                value="${state.playerName}"
                oninput="state.playerName = this.value"
                onkeydown="if(event.key==='Enter') startExpedition()"
                placeholder="Ketik namamu di sini... (contoh: Raka)"
                class="w-full px-4 py-3 rounded-2xl border-2 border-sky-300 focus:border-sky-500 focus:outline-none font-bold text-slate-800 text-base bg-sky-50/70 placeholder:font-normal"
              />
            </div>

            <!-- Avatar Selection -->
            <div class="mt-5 text-left max-w-xl mx-auto">
              <p class="font-display font-bold text-slate-700 text-sm sm:text-base mb-2">
                2. Pilih Karakter Penjelajahmu:
              </p>
              <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5">

                      onclick="selectAvatar('${av.id}')"
                      class="p-3 rounded-2xl border-2 text-center transition-all ${
                        selected
                          ? av.color + ' scale-105 shadow-md ring-2 ring-amber-400'
                          : 'bg-white border-slate-200 hover:border-sky-300 text-slate-700'
                      }"
                    >
                      <div class="text-3xl sm:text-4xl mb-1">${av.emoji}</div>
                      <div class="font-display font-bold text-xs sm:text-sm leading-tight">${av.role}</div>
                      <div class="text-[11px] opacity-80 mt-0.5 leading-snug">${av.desc}</div>
                    </button>
                  `;
                }).join('')}
              </div>
            </div>

            <!-- Start Button -->
            <div class="mt-7">
              <button
                type="button"
                onclick="startExpedition()"
                class="btn-3d animate-pulse-glow w-full sm:w-auto px-8 py-4 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-500 text-white border-emerald-700 font-display font-bold text-lg sm:text-xl shadow-lg flex items-center justify-center gap-2 mx-auto"
              >
                <span>Mulai Ekspedisi</span>
                <span>🚀</span>
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function selectAvatar(id) {
      SoundFX.click();
      state.avatarId = id;
      render();
    }

    function startExpedition() {
      SoundFX.init();
      const inputEl = document.getElementById('input-player-name');
      const rawName = inputEl ? inputEl.value.trim() : state.playerName.trim();
      if (!rawName) {
        SoundFX.wrong();
        showToast('Yuk tulis nama petualangmu terlebih dahulu!', '✏️');
        if (inputEl) inputEl.focus();
        return;
      }
      state.playerName = rawName;
      SoundFX.correct();
      triggerBurstFromCenter();
      state.screen = 'map';
      render();
    }

    /* --- SCREEN 2: INTERACTIVE EXPLORATION MAP --- */
    function renderMapScreen() {
      const completedCount = state.zoneProgress.filter((z) => z.completed).length;
      const allCompleted = completedCount === ZONES.length;

      return `
        <div class="space-y-5 animate-pop">
          <!-- Map Banner -->
          <div class="card-adventure p-5 sm:p-6 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div>
              <span class="inline-block px-3 py-1 rounded-full bg-sky-100 text-sky-800 font-bold text-xs mb-1">
                🗺️ PETA EKSPLORASI NUSANTARA & DUNIA
              </span>
              <h2 class="font-display font-bold text-xl sm:text-2xl text-slate-800">

              </h2>
              <p class="text-slate-600 text-sm mt-0.5">

              </p>
            </div>

            <!-- Overall Progress Pill -->
            <div class="flex flex-col items-center sm:items-end shrink-0 bg-amber-50 border-2 border-amber-200 px-4 py-2.5 rounded-2xl">

                          prog.completed
                            ? 'bg-amber-100 border border-amber-300 text-amber-800'
                            : 'bg-slate-100 border border-slate-200 text-slate-500'

                          ${zone.badgeIcon} ${prog.completed ? zone.badgeName + ' (Diraih!)' : 'Hadiah: ' + zone.badgeName}

                          : ''

                    <!-- Island Action Buttons -->
                    <div class="flex items-center gap-2 pt-1">

                        type="button"

                      >
                        <span>📖</span> Panduan
                      </button>
                      <button
                        type="button"
                        onclick="enterZone(${idx})"

                      >
                        <span>${prog.completed ? 'Jelajahi Ulang' : 'Masuk Zona'}</span>

                      </button>

          </div>

          <!-- Certificate CTA Banner -->
          <div class="card-adventure p-4 sm:p-5 bg-gradient-to-r from-amber-50 via-yellow-50 to-orange-50 border-amber-300 flex flex-col sm:flex-row items-center justify-between gap-4">

                <p class="text-xs sm:text-sm text-amber-800/80">

                    allCompleted
                      ? 'Luar biasa! Kamu siap melihat rapor capaian dan mencetak Sertifikat Penjaga Nusantara.'

            <button
              type="button"

    function goToMap() {
      SoundFX.click();
      state.screen = 'map';
      render();
    }

    /* --- SCREEN 3: ZONE MISSION ENGINE --- */
    function enterZone(zoneId) {
      SoundFX.click();
      state.currentZoneId = zoneId;
      state.currentMissionIdx = 0;
      // Restore hearts if depleted when entering a new zone
      if (state.hearts <= 0) {
        state.hearts = state.maxHearts;
      }
      // Reset zone score tracking for fresh run
      state.zoneProgress[zoneId].correctCount = 0;
      state.zoneProgress[zoneId].xpEarned = 0;
      prepareMissionState();
      state.screen = 'mission';
      render();
    }

    function prepareMissionState() {
      const zone = ZONES[state.currentZoneId];
      const mission = zone.missions[state.currentMissionIdx];
      state.answered = false;
      state.isCurrentCorrect = false;
      state.pgSelected = null;
      state.pgkChecked = [];
      state.tfAnswers = {};
      state.matchSelectedLeft = null;
      state.matchPairsDone = {};
      state.fillInput = '';
      state.caseSelected = null;

      if (mission.type === 'match') {
        const rightItems = mission.pairs.map((p, idx) => ({ idx, text: p.right }));
        // Deterministic-safe shuffle
        for (let i = rightItems.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [rightItems[i], rightItems[j]] = [rightItems[j], rightItems[i]];
        }
        state.matchShuffledRight = rightItems;
      }
    }

    function renderMissionScreen() {
      const zone = ZONES[state.currentZoneId];
      const mission = zone.missions[state.currentMissionIdx];
      const totalM = zone.missions.length;
      const progressPct = ((state.currentMissionIdx + (state.answered ? 1 : 0)) / totalM) * 100;

      return `
        <div class="max-w-3xl mx-auto space-y-4 animate-pop">
          <!-- Zone Top Bar -->
          <div class="card-adventure p-4">
            <div class="flex flex-wrap items-center justify-between gap-2 mb-2.5">
              <div class="flex items-center gap-2">
                <span class="text-2xl">${zone.icon}</span>
                <div>
                  <span class="text-xs font-extrabold uppercase tracking-wider ${zone.accentText}">
                    ${zone.bab} • ${zone.title}
                  </span>
                  <div class="font-display font-bold text-slate-800 text-sm sm:text-base">
                    Tantangan ${state.currentMissionIdx + 1} dari ${totalM}
                  </div>
                </div>
              </div>

              <button
                type="button"
                onclick="openStimulusModal(${zone.id})"
                class="btn-3d bg-amber-100 hover:bg-amber-200 text-amber-900 border-amber-400 font-display font-bold text-xs sm:text-sm px-3.5 py-2 rounded-xl flex items-center gap-1.5"
              >
                <span>📖</span> Baca Kartu Panduan
              </button>
            </div>

            <!-- Progress Bar -->
            <div class="w-full h-3.5 bg-slate-200 rounded-full overflow-hidden p-0.5">
              <div class="h-full rounded-full bg-gradient-to-r ${zone.themeGradient} transition-all duration-500" style="width: ${progressPct}%"></div>
            </div>
          </div>

          <!-- Mission Question Card -->
          <div id="mission-card" class="card-adventure p-5 sm:p-7 space-y-5">
            <div>
              <span class="inline-block text-xs font-extrabold px-3 py-1 rounded-full bg-sky-100 text-sky-800 mb-2">
                ${mission.akmRef}
              </span>
              <h3 class="font-display font-bold text-lg sm:text-xl text-slate-800 leading-snug">
                ${mission.prompt}
              </h3>
            </div>

            <!-- Dynamic Mini-Game Area -->
            <div>
              ${renderMissionInteractiveBody(mission)}
            </div>

            <!-- Feedback Banner (Shown after answering) -->
            ${
              state.answered
                ? `
                <div class="p-4 rounded-2xl border-2 animate-pop ${
                  state.isCurrentCorrect
                    ? 'bg-emerald-50 border-emerald-400 text-emerald-900'
                    : 'bg-rose-50 border-rose-400 text-rose-900'
                }">
                  <div class="flex items-start gap-3">
                    <div class="text-3xl">${state.isCurrentCorrect ? '🌟' : '💡'}</div>
                    <div class="flex-1">
                      <h4 class="font-display font-bold text-base sm:text-lg">
                        ${state.isCurrentCorrect ? 'Hebat Sekali! Jawabanmu Tepat! (+20 XP)' : 'Hampir Tepat! Yuk Pelajari Penjelasannya:'}
                      </h4>
                      <p class="text-sm mt-1 leading-relaxed">${mission.explanation}</p>
                    </div>
                  </div>
                </div>

                <div class="flex justify-end pt-1">
                  <button
                    type="button"
                    onclick="nextMission()"
                    class="btn-3d w-full sm:w-auto px-6 py-3.5 rounded-2xl bg-gradient-to-r from-sky-500 to-blue-600 text-white border-blue-800 font-display font-bold text-base sm:text-lg flex items-center justify-center gap-2"
                  >
                    <span>${state.currentMissionIdx + 1 < totalM ? 'Lanjut Tantangan Berikutnya' : 'Selesaikan Zona & Klaim Lencana'}</span>
                    <span>➔</span>
                  </button>
                </div>
              `
                : ''
            }
          </div>
        </div>
      `;
    }

    function renderMissionInteractiveBody(mission) {
      /* 1. PILIHAN GANDA */
      if (mission.type === 'pg') {
        const letters = ['A', 'B', 'C', 'D'];
        return `
          <div class="space-y-2.5">
            ${mission.options
              .map((opt, idx) => {
                let style = 'bg-white hover:bg-sky-50 border-slate-300 text-slate-800';
                if (state.answered) {
                  if (idx === mission.answer) {
                    style = 'bg-emerald-100 border-emerald-500 text-emerald-900 ring-2 ring-emerald-300';
                  } else if (idx === state.pgSelected) {
                    style = 'bg-rose-100 border-rose-500 text-rose-900';
                  } else {
                    style = 'bg-slate-50 border-slate-200 text-slate-400';
                  }
                }
                return `
                  <button
                    type="button"
                    ${state.answered ? 'disabled' : ''}
                    onclick="submitPG(${idx})"
                    class="btn-3d w-full text-left p-3.5 sm:p-4 rounded-2xl border-2 flex items-center gap-3 ${style}"
                  >
                    <span class="w-9 h-9 rounded-xl bg-sky-100 text-sky-800 font-display font-bold flex items-center justify-center shrink-0">
                      ${letters[idx]}
                    </span>
                    <span class="font-semibold text-sm sm:text-base leading-snug">${opt}</span>
                  </button>
                `;
              })
              .join('')}
          </div>
        `;
      }

      /* 2A. PILIHAN GANDA KOMPLEKS (CHECKBOXES) */
      if (mission.type === 'pgk_check') {
        return `
          <div class="space-y-2.5">
            ${mission.items
              .map((item, idx) => {
                const isChecked = state.pgkChecked.includes(idx);
                const isRightItem = mission.correctIndices.includes(idx);
                let style = isChecked
                  ? 'bg-sky-100 border-sky-500 text-sky-900'
                  : 'bg-white hover:bg-slate-50 border-slate-300 text-slate-800';
                if (state.answered) {
                  if (isRightItem) {
                    style = 'bg-emerald-100 border-emerald-500 text-emerald-900';
                  } else if (isChecked && !isRightItem) {
                    style = 'bg-rose-100 border-rose-500 text-rose-900';
                  } else {
                    style = 'bg-slate-50 border-slate-200 text-slate-500';
                  }
                }
                return `
                  <button
                    type="button"
                    ${state.answered ? 'disabled' : ''}
                    onclick="togglePGK(${idx})"
                    class="btn-3d w-full text-left p-3.5 rounded-2xl border-2 flex items-center gap-3 ${style}"
                  >
                    <span class="w-8 h-8 rounded-lg border-2 flex items-center justify-center text-lg font-bold shrink-0 ${
                      isChecked ? 'bg-sky-500 border-sky-700 text-white' : 'bg-white border-slate-300 text-transparent'
                    }">
                      ✓
                    </span>
                    <span class="font-semibold text-sm sm:text-base leading-snug">${item}</span>
                  </button>
                `;
              })
              .join('')}

            ${
              !state.answered
                ? `
              <div class="pt-2">
                <button
                  type="button"
                  onclick="submitPGK()"
                  class="btn-3d w-full sm:w-auto px-6 py-3 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-white border-emerald-700 font-display font-bold text-base"
                >
                  Periksa Jawaban ✓
                </button>
              </div>
            `
                : ''
            }
          </div>
        `;
      }

      /* 2B. PILIHAN GANDA KOMPLEKS (TABEL BENAR / SALAH) */
      if (mission.type === 'pgk_tf') {
        return `
          <div class="space-y-3">
            ${mission.statements
              .map((st, idx) => {
                const chosen = state.tfAnswers[idx]; // true | false | undefined
                return `
                  <div class="p-3.5 rounded-2xl border-2 border-slate-200 bg-slate-50/70 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                    <p class="font-semibold text-sm sm:text-base text-slate-800 flex-1">${idx + 1}. ${st.text}</p>
                    <div class="flex items-center gap-2 shrink-0">
                      <button
                        type="button"
                        ${state.answered ? 'disabled' : ''}
                        onclick="selectTF(${idx}, true)"
                        class="btn-3d px-4 py-2 rounded-xl border-2 font-display font-bold text-xs sm:text-sm ${
                          chosen === true
                            ? 'bg-emerald-500 border-emerald-700 text-white'
                            : 'bg-white border-slate-300 text-slate-700 hover:bg-emerald-50'
                        }"
                      >
                        Benar
                      </button>
                      <button
                        type="button"
                        ${state.answered ? 'disabled' : ''}
                        onclick="selectTF(${idx}, false)"
                        class="btn-3d px-4 py-2 rounded-xl border-2 font-display font-bold text-xs sm:text-sm ${
                          chosen === false
                            ? 'bg-rose-500 border-rose-700 text-white'
                            : 'bg-white border-slate-300 text-slate-700 hover:bg-rose-50'
                        }"
                      >
                        Salah
                      </button>
                    </div>
                  </div>
                `;
              })
              .join('')}

            ${
              !state.answered
                ? `
              <div class="pt-1">
                <button
                  type="button"
                  onclick="submitTF()"
                  class="btn-3d w-full sm:w-auto px-6 py-3 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-white border-emerald-700 font-display font-bold text-base"
                >
                  Kunci Jawaban Benar/Salah ✓
                </button>
              </div>
            `
                : ''
            }
          </div>
        `;
      }

      /* 3. MINI-GAME MENJODOHKAN */
      if (mission.type === 'match') {
        const badgeColors = [
          'bg-amber-100 border-amber-400 text-amber-900',
          'bg-sky-100 border-sky-400 text-sky-900',
          'bg-purple-100 border-purple-400 text-purple-900'
        ];
        return `
          <div class="space-y-3">
            <p class="text-xs font-bold text-slate-500">
              💡 Cara bermain: Klik satu kartu di <strong>Kolom Kiri</strong>, lalu klik pasangannya di <strong>Kolom Kanan</strong>!
            </p>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
              <!-- Left Column -->
              <div class="space-y-2.5">
                ${mission.pairs
                  .map((p, idx) => {
                    const isSelected = state.matchSelectedLeft === p.id;
                    const pairedRightIdx = state.matchPairsDone[p.id];
                    const isPaired = pairedRightIdx !== undefined;
                    let cls = 'bg-white border-slate-300 text-slate-800 hover:border-sky-400';
                    if (isSelected) cls = 'bg-sky-100 border-sky-500 text-sky-900 ring-2 ring-sky-300';
                    else if (isPaired) cls = badgeColors[idx % badgeColors.length];

                    return `
                      <button
                        type="button"
                        ${state.answered ? 'disabled' : ''}
                        onclick="clickMatchLeft('${p.id}')"
                        class="btn-3d w-full text-left p-3.5 rounded-2xl border-2 font-bold text-sm flex items-center justify-between gap-2 ${cls}"
                      >
                        <span>${p.left}</span>
                        ${isPaired ? `<span class="text-xs px-2 py-0.5 rounded-full bg-white/80">Terhubung</span>` : ''}
                      </button>
                    `;
                  })
                  .join('')}
              </div>

              <!-- Right Column -->
              <div class="space-y-2.5">
                ${state.matchShuffledRight
                  .map((rItem) => {
                    // Check which left id connected to rItem.idx
                    const connectedLeftEntry = Object.entries(state.matchPairsDone).find(
                      ([, rIdx]) => rIdx === rItem.idx
                    );
                    let cls = 'bg-white border-slate-300 text-slate-700 hover:border-amber-400';
                    let tag = '';
                    if (connectedLeftEntry) {
                      const leftIdx = mission.pairs.findIndex((p) => p.id === connectedLeftEntry[0]);
                      cls = badgeColors[leftIdx % badgeColors.length];
                      tag = `<span class="text-xs font-extrabold px-2 py-0.5 rounded-full bg-white/80 shrink-0">#${leftIdx + 1}</span>`;
                    }
                    return `
                      <button
                        type="button"
                        ${state.answered ? 'disabled' : ''}
                        onclick="clickMatchRight(${rItem.idx})"
                        class="btn-3d w-full text-left p-3.5 rounded-2xl border-2 font-semibold text-xs sm:text-sm flex items-center justify-between gap-2 ${cls}"
                      >
                        <span>${rItem.text}</span>
                        ${tag}
                      </button>
                    `;
                  })
                  .join('')}
              </div>
            </div>

            ${
              !state.answered
                ? `
              <div class="flex flex-wrap items-center gap-2 pt-2">
                <button
                  type="button"
                  onclick="resetMatchPairs()"
                  class="btn-3d px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 border-slate-300 font-display font-bold text-sm"
                >
                  🔄 Ulangi Pasangan
                </button>
                <button
                  type="button"
                  onclick="submitMatch()"
                  class="btn-3d px-6 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-white border-emerald-700 font-display font-bold text-base"
                >
                  Periksa Pasangan ✓
                </button>
              </div>
            `
                : ''
            }
          </div>
        `;
      }

      /* 4. TANTANGAN ISIAN CEPAT */
      if (mission.type === 'fill') {
        return `
          <div class="space-y-3">
            <div class="bg-amber-50 border border-amber-200 rounded-xl px-3.5 py-2 text-xs sm:text-sm text-amber-900 font-semibold">
              🔍 Petunjuk: ${mission.hint}
            </div>

            <div class="flex flex-col sm:flex-row gap-2">
              <input
                id="fill-answer-input"
                type="text"
                ${state.answered ? 'disabled' : ''}
                value="${state.fillInput}"
                oninput="state.fillInput = this.value"
                onkeydown="if(event.key==='Enter' && !state.answered) submitFill()"
                placeholder="Ketik atau klik pilihan kata di bawah..."
                class="flex-1 px-4 py-3 rounded-2xl border-2 border-sky-300 focus:border-sky-500 focus:outline-none font-display font-bold uppercase text-base sm:text-lg text-slate-800 bg-sky-50/50"
              />
              ${
                !state.answered
                  ? `
                <button
                  type="button"
                  onclick="submitFill()"
                  class="btn-3d px-6 py-3 rounded-2xl bg-emerald-500 hover:bg-emerald-400 text-white border-emerald-700 font-display font-bold text-base shrink-0"
                >
                  Jawab ✓
                </button>
              `
                  : ''
              }
            </div>

            ${
              mission.quickChoices && !state.answered
                ? `
              <div class="pt-1">
                <p class="text-xs font-bold text-slate-500 mb-1.5">Atau pilih kartu jawaban cepat:</p>
                <div class="flex flex-wrap gap-2">
                  ${mission.quickChoices
                    .map(
                      (qc) => `
                    <button
                      type="button"
                      onclick="pickQuickFill('${qc}')"
                      class="btn-3d px-3.5 py-2 rounded-xl bg-white hover:bg-sky-50 border-2 border-sky-200 text-sky-900 font-display font-bold text-xs sm:text-sm"
                    >
                      ${qc}
                    </button>
                  `
                    )
                    .join('')}
                </div>
              </div>
            `
                : ''
            }

            ${
              mission.letterBank && !state.answered
                ? `
              <div class="pt-1">
                <p class="text-xs font-bold text-slate-500 mb-1.5">Bantuan Huruf Acak (klik untuk merangkai kata):</p>
                <div class="flex flex-wrap items-center gap-1.5">
                  ${mission.letterBank
                    .map(
                      (ch) => `
                    <button
                      type="button"
                      onclick="appendFillLetter('${ch}')"
                      class="btn-3d w-9 h-9 rounded-xl bg-amber-100 hover:bg-amber-200 border-2 border-amber-400 text-amber-900 font-display font-bold text-sm"
                    >
                      ${ch}
                    </button>
                  `
                    )
                    .join('')}
                  <button
                    type="button"
                    onclick="clearFillInput()"
                    class="btn-3d px-3 h-9 rounded-xl bg-rose-100 hover:bg-rose-200 border-2 border-rose-300 text-rose-800 font-bold text-xs"
                  >
                    Hapus
                  </button>
                </div>
              </div>
            `
                : ''
            }
          </div>
        `;
      }

      /* 5. MISI KASUS PENALARAN (ADAPTASI SOAL URAIAN) */
      if (mission.type === 'case') {
        return `
          <div class="space-y-3">
            <p class="text-xs font-bold text-purple-700 bg-purple-50 border border-purple-200 px-3 py-1.5 rounded-xl inline-block">
              🧠 Misi Penalaran & Pengambilan Keputusan
            </p>
            <div class="space-y-2.5">
              ${mission.options
                .map((opt, idx) => {
                  let cls = 'bg-white hover:bg-amber-50 border-slate-300 text-slate-800';
                  if (state.answered) {
                    if (opt.isCorrect) {
                      cls = 'bg-emerald-100 border-emerald-500 text-emerald-900 ring-2 ring-emerald-300';
                    } else if (idx === state.caseSelected) {
                      cls = 'bg-rose-100 border-rose-500 text-rose-900';
                    } else {
                      cls = 'bg-slate-50 border-slate-200 text-slate-400';
                    }
                  }
                  return `
                    <button
                      type="button"
                      ${state.answered ? 'disabled' : ''}
                      onclick="submitCase(${idx})"
                      class="btn-3d w-full text-left p-4 rounded-2xl border-2 space-y-1 ${cls}"
                    >
                      <div class="font-display font-bold text-sm sm:text-base">${opt.title}</div>
                      <p class="text-xs sm:text-sm opacity-90 leading-relaxed">${opt.desc}</p>
                    </button>
                  `;
                })
                .join('')}
            </div>
          </div>
        `;
      }

      return '';
    }

    /* =========================================================================
       7. MISSION SUBMISSION & SCORING LOGIC
       ========================================================================= */
    function finalizeAnswer(isCorrect) {
      state.answered = true;
      state.isCurrentCorrect = isCorrect;

      if (isCorrect) {
        SoundFX.correct();
        triggerBurstFromCenter();
        state.streak += 1;
        if (state.streak > state.bestStreak) state.bestStreak = state.streak;
        const bonus = state.streak >= 3 ? 5 : 0;
        const gained = 20 + bonus;
        state.xp += gained;
        state.zoneProgress[state.currentZoneId].correctCount += 1;
        state.zoneProgress[state.currentZoneId].xpEarned += gained;
      } else {
        SoundFX.wrong();
        state.streak = 0;
        if (state.hearts > 0) state.hearts -= 1;
        const card = document.getElementById('mission-card');
        if (card) {
          card.classList.remove('animate-shake');
          void card.offsetWidth;
          card.classList.add('animate-shake');
        }
      }
      render();
    }

    // PG Handler
    function submitPG(idx) {
      const mission = ZONES[state.currentZoneId].missions[state.currentMissionIdx];
      state.pgSelected = idx;
      finalizeAnswer(idx === mission.answer);
    }

    // PGK Checkbox Handlers
    function togglePGK(idx) {
      SoundFX.click();
      const pos = state.pgkChecked.indexOf(idx);
      if (pos === -1) state.pgkChecked.push(idx);
      else state.pgkChecked.splice(pos, 1);
      render();
    }

    function submitPGK() {
      if (state.pgkChecked.length === 0) {
        SoundFX.wrong();
        showToast('Pilih minimal satu pernyataan terlebih dahulu!', '☑️');
        return;
      }
      const mission = ZONES[state.currentZoneId].missions[state.currentMissionIdx];
      const sortedUser = [...state.pgkChecked].sort().join(',');
      const sortedRight = [...mission.correctIndices].sort().join(',');
      finalizeAnswer(sortedUser === sortedRight);
    }

    // PGK True/False Handlers
    function selectTF(rowIdx, val) {
      SoundFX.click();
      state.tfAnswers[rowIdx] = val;
      render();
    }

    function submitTF() {
      const mission = ZONES[state.currentZoneId].missions[state.currentMissionIdx];
      if (Object.keys(state.tfAnswers).length < mission.statements.length) {
        SoundFX.wrong();
        showToast('Lengkapi semua pilihan Benar atau Salah di setiap baris!', '📋');
        return;
      }
      const allRight = mission.statements.every((st, idx) => state.tfAnswers[idx] === st.isTrue);
      finalizeAnswer(allRight);
    }

    // Matching Handlers
    function clickMatchLeft(leftId) {
      SoundFX.click();
      state.matchSelectedLeft = state.matchSelectedLeft === leftId ? null : leftId;
      render();
    }

    function clickMatchRight(rightIdx) {
      if (!state.matchSelectedLeft) {
        SoundFX.wrong();
        showToast('Klik kartu di kolom kiri terlebih dahulu!', '👈');
        return;
      }
      SoundFX.click();
      // Remove any previous left item mapped to this rightIdx
      for (const [k, v] of Object.entries(state.matchPairsDone)) {
        if (v === rightIdx) delete state.matchPairsDone[k];
      }
      state.matchPairsDone[state.matchSelectedLeft] = rightIdx;
      state.matchSelectedLeft = null;
      render();
    }

    function resetMatchPairs() {
      SoundFX.click();
      state.matchSelectedLeft = null;
      state.matchPairsDone = {};
      render();
    }

    function submitMatch() {
      const mission = ZONES[state.currentZoneId].missions[state.currentMissionIdx];
      if (Object.keys(state.matchPairsDone).length < mission.pairs.length) {
        SoundFX.wrong();
        showToast('Hubungkan semua 3 pasangan kartu sebelum memeriksa!', '🔗');
        return;
      }
      const allMatched = mission.pairs.every((p, idx) => state.matchPairsDone[p.id] === idx);
      finalizeAnswer(allMatched);
    }

    // Fill-in Handlers
    function pickQuickFill(text) {
      SoundFX.click();
      state.fillInput = text;
      render();
    }

    function appendFillLetter(ch) {
      SoundFX.click();
      state.fillInput = (state.fillInput + ch).toUpperCase();
      render();
    }

    function clearFillInput() {
      SoundFX.click();
      state.fillInput = '';
      render();
    }

    function submitFill() {
      const mission = ZONES[state.currentZoneId].missions[state.currentMissionIdx];
      const cleaned = state.fillInput.trim().toUpperCase().replace(/\s+/g, ' ');
      if (!cleaned) {
        SoundFX.wrong();
        showToast('Isi jawabanmu terlebih dahulu!', '✍️');
        return;
      }
      // Accept 'PBB' or 'PERSERIKATAN BANGSA-BANGSA'
      const isPbbAlias =
        mission.answer === 'PBB' &&
        (cleaned === 'PBB' || cleaned.includes('PERSERIKATAN BANGSA'));
      const isExact = cleaned === mission.answer.toUpperCase();
      finalizeAnswer(isExact || isPbbAlias);
    }

    // Case Reasoning Handler
    function submitCase(idx) {
      const mission = ZONES[state.currentZoneId].missions[state.currentMissionIdx];
      state.caseSelected = idx;
      finalizeAnswer(Boolean(mission.options[idx].isCorrect));
    }

    // Next Mission / Complete Zone
    function nextMission() {
      SoundFX.click();
      const zone = ZONES[state.currentZoneId];
      if (state.currentMissionIdx + 1 < zone.missions.length) {
        state.currentMissionIdx += 1;
        prepareMissionState();
        render();
      } else {
        // Zone Completed!
        state.zoneProgress[state.currentZoneId].completed = true;
        SoundFX.badge();
        triggerBurstFromCenter();
        showToast(`Selamat! Kamu meraih ${zone.badgeName}!`, zone.badgeIcon);
        const allDone = state.zoneProgress.every((z) => z.completed);
        state.screen = allDone ? 'certificate' : 'map';
        render();
      }
    }

    /* --- SCREEN 4: CERTIFICATE & SUMMARY --- */
    function openCertificate() {
      SoundFX.badge();
      triggerBurstFromCenter();
      state.screen = 'certificate';
      render();
    }

    function renderCertificateScreen() {
      const av = getAvatar();
      const totalCorrect = state.zoneProgress.reduce((acc, z) => acc + z.correctCount, 0);
      const totalMissions = ZONES.reduce((acc, z) => acc + z.missions.length, 0);
      const accuracy = Math.round((totalCorrect / totalMissions) * 100);

      let predikat = 'Terus Berlatih 🌱';
      let predikatDesc = 'Semangat! Ulangi zona yang belum sempurna untuk meraih lencana emas.';
      if (accuracy >= 85) {
        predikat = 'Mahir (Penjaga Utama Nusantara) 🏆';
        predikatDesc = 'Luar biasa! Penguasaan sains, sejarah, geografi, dan budaya Indonesiamu sangat mengagumkan!';
      } else if (accuracy >= 65) {
        predikat = 'Cakap (Penjelajah Handal) 🌟';
        predikatDesc = 'Bagus sekali! Kamu sudah memahami sebagian besar materi IPAS Kelas 6 dengan baik.';
      }

      return `
        <div class="max-w-3xl mx-auto space-y-5 animate-pop">
          <div class="card-adventure print-only-clean p-6 sm:p-8 border-4 border-amber-400 bg-gradient-to-b from-amber-50 via-white to-sky-50 text-center space-y-5">
            <div class="inline-block px-4 py-1 rounded-full bg-amber-200/80 text-amber-900 font-display font-bold text-xs tracking-wider uppercase">
              SERTIFIKAT PENGHARGAAN PETUALANG IPAS
            </div>

            <div class="text-5xl sm:text-6xl">${av.emoji}🏆</div>

            <div>
              <p class="text-slate-500 text-sm font-semibold">Diberikan dengan bangga kepada:</p>
              <h2 class="font-display font-bold text-2xl sm:text-4xl text-sky-900 mt-1">
                ${state.playerName}
              </h2>
              <p class="font-display font-semibold text-amber-700 text-sm sm:text-base mt-0.5">
                Peran: ${av.role}
              </p>
            </div>

            <div class="max-w-lg mx-auto bg-white/90 border-2 border-amber-200 rounded-2xl p-4">
              <div class="text-xs font-bold text-slate-500 uppercase">Predikat Penguasaan AKM</div>
              <div class="font-display font-bold text-lg sm:text-xl text-emerald-700 mt-0.5">${predikat}</div>
              <p class="text-xs sm:text-sm text-slate-600 mt-1">${predikatDesc}</p>
            </div>

            <!-- Stats Grid -->
            <div class="grid grid-cols-3 gap-2.5 max-w-lg mx-auto">
              <div class="bg-amber-100/80 border border-amber-300 rounded-2xl p-3">
                <div class="text-xs font-bold text-amber-800">Total XP</div>
                <div class="font-display font-bold text-lg sm:text-2xl text-amber-900">${state.xp}</div>
              </div>
              <div class="bg-emerald-100/80 border border-emerald-300 rounded-2xl p-3">
                <div class="text-xs font-bold text-emerald-800">Misi Tepat</div>
                <div class="font-display font-bold text-lg sm:text-2xl text-emerald-900">${totalCorrect}/${totalMissions}</div>
              </div>
              <div class="bg-sky-100/80 border border-sky-300 rounded-2xl p-3">
                <div class="text-xs font-bold text-sky-800">Skor AKM</div>
                <div class="font-display font-bold text-lg sm:text-2xl text-sky-900">${accuracy}%</div>
              </div>
            </div>

            <!-- Zone Breakdown & Badges -->
            <div class="text-left space-y-2 pt-2">
              <h3 class="font-display font-bold text-slate-700 text-sm sm:text-base">
                Koleksi Lencana & Rekap Capaian per Bab:
              </h3>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                ${ZONES.map((z, idx) => {
                  const prog = state.zoneProgress[idx];
                  return `
                    <div class="p-3 rounded-2xl border-2 flex items-center justify-between gap-2 ${
                      prog.completed ? 'bg-white border-amber-300' : 'bg-slate-50 border-slate-200 opacity-75'
                    }">
                      <div class="flex items-center gap-2.5">
                        <span class="text-2xl">${prog.completed ? z.badgeIcon : '🔒'}</span>
                        <div>
                          <div class="font-display font-bold text-xs sm:text-sm text-slate-800">${z.bab}: ${z.title}</div>
                          <div class="text-xs text-slate-500">${prog.completed ? z.badgeName : 'Belum dituntaskan'}</div>
                        </div>
                      </div>
                      <span class="font-display font-bold text-xs px-2.5 py-1 rounded-lg bg-sky-100 text-sky-800 shrink-0">
                        ${prog.correctCount}/${prog.totalMissions}
                      </span>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex flex-wrap items-center justify-center gap-3 pt-3 no-print">
              <button
                type="button"
                onclick="goToMap()"
                class="btn-3d px-5 py-3 rounded-2xl bg-sky-500 hover:bg-sky-400 text-white border-sky-700 font-display font-bold text-sm sm:text-base"
              >
                🗺️ Kembali ke Peta Pulau
              </button>
              <button
                type="button"
                onclick="window.print()"
                class="btn-3d px-5 py-3 rounded-2xl bg-amber-500 hover:bg-amber-400 text-white border-amber-700 font-display font-bold text-sm sm:text-base"
              >
                🖨️ Cetak Sertifikat
              </button>
              <button
                type="button"
                onclick="resetWholeGame()"
                class="btn-3d px-5 py-3 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-700 border-slate-300 font-display font-bold text-sm sm:text-base"
              >
                🔄 Main Dari Awal
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function resetWholeGame() {
      SoundFX.click();
      state.xp = 0;
      state.hearts = 5;
      state.streak = 0;
      state.bestStreak = 0;
      state.zoneProgress = ZONES.map((z) => ({
        completed: false,
        correctCount: 0,
        totalMissions: z.missions.length,
        xpEarned: 0
      }));
      state.screen = 'welcome';
      render();
    }

    /* =========================================================================
       8. INITIALIZE APPLICATION ON LOAD
       ========================================================================= */
    window.onload = function () {
      ParticleFX.init();
      render();
    };
  </script>
</body>
</html>
